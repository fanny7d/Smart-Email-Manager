[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smart-email-manager"
version = "0.1.0"
description = "API-first mailbox fleet management platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fanny7d contributors" }]
keywords = ["outlook", "email", "fastapi", "automation", "mailbox-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=50,<51",
  "croniter>=6,<7",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pysocks>=1.7,<2",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "sqlalchemy[asyncio]>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
sem = "smart_email_manager.cli.main:app"
sem-api = "smart_email_manager.entrypoints:run_api"
sem-migrate = "smart_email_manager.tools.migrate:main"
sem-worker = "smart_email_manager.entrypoints:run_worker"
sem-openapi = "smart_email_manager.tools.export_openapi:main"

[project.urls]
Homepage = "https://github.com/fanny7d/Smart-Email-Manager"
Documentation = "https://github.com/fanny7d/Smart-Email-Manager/tree/main/docs"
Issues = "https://github.com/fanny7d/Smart-Email-Manager/issues"
Repository = "https://github.com/fanny7d/Smart-Email-Manager.git"

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PySocks>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_email_manager"]

[tool.hatch.build.targets.wheel.force-include]
migrations = "smart_email_manager_migrations"

[tool.hatch.build.targets.sdist]
include = [
  "/alembic.ini",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/docs",
  "/LICENSE",
  "/migrations",
  "/pyproject.toml",
  "/README.md",
  "/SECURITY.md",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/0d4e5f6a7b8c_outlook_only_scope.py" = ["S608"]
"scripts/accept_cli.py" = ["S603", "S607"]
"scripts/check_secrets.py" = ["S603"]
"tests/**" = ["S106"]
"tests/test_config.py" = ["S104", "S106"]
"tests/test_secret_scanner.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]
