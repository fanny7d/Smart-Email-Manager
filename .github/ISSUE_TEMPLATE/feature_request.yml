name: Feature request
description: Propose an Outlook mailbox-management improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the automation or fleet-management problem, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API and CLI impact
      description: Explain how automation should consume this feature.
  - type: textarea
    id: safety
    attributes:
      label: Security and destructive-action considerations
