name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: smart_email_manager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_email_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SEM_ENVIRONMENT: test
      SEM_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/smart_email_manager_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6
        if: matrix.python-version == '3.14'
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        if: matrix.python-version == '3.14'
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --all-groups --locked

      - name: Apply PostgreSQL migrations
        run: uv run sem-migrate

      - name: Verify Alembic model drift
        run: uv run alembic check

      - name: Verify Python
        run: |
          uv run ruff check .
          uv run mypy
          uv run python scripts/check_secrets.py
          uv run pytest

      - name: Verify shell scripts
        if: matrix.python-version == '3.14'
        run: shellcheck deploy/postgres/init-roles.sh

      - name: Verify OpenAPI snapshot
        if: matrix.python-version == '3.14'
        run: |
          uv run sem-openapi
          git diff --exit-code -- contracts/openapi.json

      - name: Install web dependencies
        if: matrix.python-version == '3.14'
        run: pnpm install --frozen-lockfile

      - name: Verify Markdown
        if: matrix.python-version == '3.14'
        run: pnpm lint:markdown

      - name: Verify generated TypeScript client
        if: matrix.python-version == '3.14'
        run: |
          pnpm --dir web generate:api
          git diff --exit-code -- web/src/api/generated

      - name: Verify React application
        if: matrix.python-version == '3.14'
        run: |
          pnpm --dir web test
          pnpm --dir web build

      - name: Verify browser extension
        if: matrix.python-version == '3.14'
        run: pnpm --dir extension build

      - name: Verify production Compose model
        if: matrix.python-version == '3.14'
        run: docker compose --env-file .env.production.example config --quiet

      - name: Verify package build
        if: matrix.python-version == '3.14'
        run: uv build

      - name: Verify 10,000-account scale boundary
        if: matrix.python-version == '3.14'
        run: uv run python scripts/benchmark_scale.py --database-url "$SEM_DATABASE_URL" --accounts 10000

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --all-groups --locked
      - run: pnpm install --frozen-lockfile
      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit --progress-spinner off --skip-editable
      - name: Audit JavaScript dependencies
        run: pnpm audit --registry=https://registry.npmjs.org --audit-level high
